[project]
name = "inelastic-dm-server"
version = "0.1.0"
description = "MCP server for inelastic dark matter predictions: recoil spectra, relic density, and cosmological constraints motivated by the LZ 248 keV event"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tools*", "mcp_server*"]
